# cargo-deny configuration. Runs in CI on every PR; the matching
# step lives in `.github/workflows/ci.yml`.
#
# Four checks, scoped to what we actually care about:
#   * advisories — RUSTSEC vulnerabilities + unmaintained warnings
#   * licenses   — allow-list of GPL-3-compatible permissive licenses
#   * bans       — wildcards warned; duplicate versions warned
#   * sources    — crates.io only

[advisories]
# Severity for vulnerability advisories is "deny" by default. Below
# are explicit upstream-unmaintained advisories we cannot fix
# without bumping a parent dep that doesn't have a fix yet.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained. Transitive via gpui-component (GPUI Kit) and metal -> gpui-pre-apple. Can't fix without upstream bumps; revisit at each gpui pull." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 unmaintained. Transitive via gpui-kit-assets -> gpui-pre-reqwest. Clears when that reqwest fork migrates to rustls-pki-types; revisit at each GPUI Kit bump." },
    { id = "RUSTSEC-2024-0384", reason = "instant 0.1.13 unmaintained. Transitive via gpui-base / gpui-component (GPUI Kit); revisit at each GPUI Kit bump." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5.x unmaintained (merged into zbus 6 as its `wire` module). Transitive, Linux only: zbus 5 -> accesskit_unix / ashpd / oo7 -> gpui_linux. Clears when gpui moves to zbus 6; revisit at each gpui pull." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6). Same path and fix horizon as RUSTSEC-2026-0370." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus 6). Same path and fix horizon as RUSTSEC-2026-0370." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained. Transitive via fontdb -> usvg -> gpui (SVG rendering). Clears when upstream migrates fontdb/usvg off ttf-parser (skrifa is the successor); revisit at each gpui pull." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained. Transitive via usvg -> gpui (SVG rendering) — same RazrFalcon-maintained family as ttf-parser above, same fix horizon: clears when upstream moves usvg's text shaping off rustybuzz (harfrust is the successor); revisit at each gpui pull." },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic duplicate-attribute check (DoS-class). Build-time only: wayland-scanner's proc-macro codegen (Linux gpui build dep) parses the bundled Wayland protocol XML; no runtime input reaches it. Clears when the Linux build chain moves to quick-xml >= 0.41; revisit at each gpui pull." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml unbounded NsReader namespace allocation (DoS-class). Same build-time-only wayland-scanner path as RUSTSEC-2026-0194, same fix horizon." },
]

[licenses]
# Every license below is GPL-3-or-later compatible (etch341's own
# license — see ./LICENSE). Updates require a real check that the
# new license is GPL-3-compatible AND acceptable for redistribution.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# Per-crate exceptions for license expressions that are valid for
# the specific dep but not worth blessing globally.
[[licenses.exceptions]]
# mu_uefi_decompress (direct dep: UEFI-compressed section decoding)
# is BSD-2-Clause-Patent — OSI-approved and GPL-compatible (BSD-2 plus
# an explicit patent grant). Scoped to this crate.
crate = "mu_uefi_decompress"
allow = ["BSD-2-Clause-Patent"]

# `unescaper` ships with the deprecated `GPL-3.0/MIT` SPDX
# expression in its Cargo.toml. The slash form means "user picks
# either"; the modern equivalent is `GPL-3.0-or-later OR MIT`.
# Clarify so the check sees MIT (which we allow above) rather than
# the unparseable expression.
[[licenses.clarify]]
crate = "unescaper"
expression = "MIT"
license-files = []

[bans]
# Duplicate versions are noisy on the gpui stack (windows-sys
# major-version churn, etc.). "warn" so CI surfaces the count
# without failing.
multiple-versions = "warn"
# Wildcard version specs (incl. rev-less git deps) are warned, not
# denied. There are none today; this catches one creeping in.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# crates.io only. GPUI Kit + gpui-pre made the build git-free; any
# git dependency now fails `unknown-git`.
allow-git = []
